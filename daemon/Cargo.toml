[package]
name = "remoteagent-daemon"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "RemoteAgent home daemon: holds PTY sessions, dials out to the relay"

[dependencies]
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

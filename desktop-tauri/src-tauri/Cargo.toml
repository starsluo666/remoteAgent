[package]
name = "remoteagent-desktop"
version = "0.1.0"
edition = "2021"
description = "RemoteAgent 桌面客户端（Tauri 2 壳，复用 web 前端）"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
